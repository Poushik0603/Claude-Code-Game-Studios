# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: mvp_message_type_catalog
    status: active
    source: design/gdd/websocket-message-protocol.md
    referenced_by:
      - design/gdd/websocket-message-protocol.md
    value: "Intents: JOIN_ROOM, LEAVE_ROOM, START_GAME, KICK_PLAYER, UPDATE_ROOM_SETTINGS, PLAY_CARD, DRAW_CARD, CALL_UNO, CATCH_UNO, PLAY_AGAIN. Broadcasts: ROOM_STATE_SYNC, GAME_STATE_SYNC, ERROR_MSG, GAME_OVER, PLAYER_DISCONNECTED, PLAYER_RECONNECTED."
    unit: "message type names (SCREAMING_SNAKE_CASE)"
    notes: "MVP-tier (Room/Lobby + Normal UNO) only. No Mercy/Flip will add mode-specific types additively — see source GDD Open Questions."
    added: 2026-09-29
    revised: ""

