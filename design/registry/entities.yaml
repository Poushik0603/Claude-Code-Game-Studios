# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: session_id_collision_probability
    status: active
    source: design/gdd/player-identity-session.md
    referenced_by:
      - design/gdd/player-identity-session.md
    variables:
      - n
    output_range: [0, 1]
    expression: "P_collision ≈ (n^2) / (2 * 2^122)"
    notes: "Justifies why no server-side uniqueness check is needed for crypto.randomUUID()-based sessionIds at this game's scale (effectively 0 even at n=10^6)."
    added: 2026-09-29
    revised: ""

  - name: intent_rate_limit
    status: active
    source: design/gdd/websocket-message-protocol.md
    referenced_by:
      - design/gdd/websocket-message-protocol.md
    variables:
      - intents_received_in_window
      - max_intents_per_window
      - window_ms
    output_range: [0, 1]
    expression: "is_rejected = (intents_received_in_window > max_intents_per_window)"
    notes: "Boolean gate. Default tuning: max_intents_per_window=20, window_ms=1000 (unvalidated estimate, see Open Questions in source GDD)."
    added: 2026-09-29
    revised: ""

  - name: reshuffle_on_empty
    status: active
    source: design/gdd/card-deck-primitives.md
    referenced_by:
      - design/gdd/card-deck-primitives.md
    variables:
      - drawPile
      - discardPile
    output_range: [1, 1]
    expression: "if drawPile.isEmpty(): topCard = discardPile.pop(); drawPile = shuffle(discardPile); discardPile = [topCard]; return drawPile.pop()"
    notes: "Always returns exactly 1 card, unless both piles would be empty after reshuffle (see card-deck-primitives.md Edge Cases — throws/returns explicit no-cards-available result instead)."
    added: 2026-09-29
    revised: ""

